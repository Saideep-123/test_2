<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konaseema Specials – WhatsApp Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
body{background:#fafafa;color:#333;scroll-behavior:smooth;}
body.dark{background:#121212;color:#eee;}

header{position:sticky;top:0;background:#fff;padding:0.7rem 1rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:30;}
.logo{position:absolute;left:50%;transform:translateX(-50%);font-weight:700;font-size:1.4rem;color:#c0392b;cursor:pointer;}
.search{width:180px;padding:.35rem .8rem;border-radius:20px;border:1px solid #ccc;}
.toggle{border:none;background:#eee;border-radius:50%;padding:.5rem .7rem;cursor:pointer;}
button{cursor:pointer;}

.hero{height:60vh;background:url('https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;}
.hero::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5);}
.hero h1{color:#fff;font-size:3rem;z-index:1;margin-bottom:1rem;}
.hero button{z-index:1;padding:0.7rem 1.5rem;border:none;border-radius:50px;background:#c0392b;color:#fff;}

.featured{padding:1rem;display:flex;gap:1rem;overflow-x:auto;}
.featured::-webkit-scrollbar{display:none;}
.featured-item{min-width:220px;background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.1);flex-shrink:0;}
.featured-item img{width:100%;height:140px;object-fit:cover;border-radius:20px 20px 0 0;}
.featured-item .info{padding:.5rem;}

.categories{display:flex;gap:.7rem;padding:1rem;overflow-x:auto;margin-bottom:.5rem;}
.categories button{border:none;padding:.5rem 1.2rem;border-radius:25px;background:#eee;font-weight:500;}
.categories button.active{background:#c0392b;color:#fff;}

.products{padding:1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.6rem;}
.product{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.product img{width:100%;height:160px;object-fit:cover;}
.product .info{padding:.5rem;}
.product .info strong{display:block;margin-bottom:.3rem;font-weight:600;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:40;}
.modal.active{display:flex;}
.modal-content{background:#fff;border-radius:20px;width:90%;max-width:480px;padding:1rem;max-height:90vh;overflow-y:auto;position:relative;}
.modal-close{position:absolute;right:10px;top:10px;font-size:1.2rem;cursor:pointer;}
.weight-boxes span{display:inline-block;padding:.3rem .8rem;border:1px solid #ccc;border-radius:16px;margin:.3rem .2rem;cursor:pointer;}
.weight-boxes span.active{background:#c0392b;color:#fff;}
.qty-box{display:flex;justify-content:center;align-items:center;gap:12px;margin:.8rem 0;}
.qty-box button{padding:.3rem .7rem;border:none;background:#eee;border-radius:6px;}

.cart{position:fixed;right:-100%;top:0;width:420px;height:100%;background:#fff;padding:1rem;box-shadow:-4px 0 24px rgba(0,0,0,.4);transition:right .3s;z-index:50;overflow-y:auto;}
.cart.open{right:0;}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin:.5rem 0; padding:.4rem; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.1);}
.cart-item span button{padding:.2rem .6rem;border-radius:6px;background:#eee;border:none;}
.primary{background:#c0392b;color:#fff;border:none;padding:.7rem;border-radius:16px;width:100%;margin-top:8px;font-weight:600;}
</style>
</head>
<body>

<div class="hero">
  <div>
    <h1>Konaseema Specials 🌸</h1>
    <button onclick="scrollToTop()">Order Now</button>
  </div>
</div>

<header>
  <input class="search" placeholder="Search" oninput="searchItems(this.value)">
  <div class="logo" onclick="scrollToTop()">Konaseema Specials</div>
  <div>
    <button class="toggle" onclick="toggleDark()">🌙</button>
    <button onclick="toggleCart()">🛒 <span id="count">0</span></button>
  </div>
</header>

<div class="featured" id="featured"></div>

<div class="categories">
  <button class="active" onclick="setCat('All',this)">All</button>
  <button onclick="setCat('Ugadi',this)">🌸 Ugadi</button>
  <button onclick="setCat('Sweets',this)">Sweets</button>
  <button onclick="setCat('Snacks',this)">Snacks</button>
  <button onclick="setCat('Podis',this)">Podis</button>
  <button onclick="setCat('Papads',this)">Papads</button>
  <button onclick="setCat('Pickles',this)">Pickles</button>
</div>

<div class="products" id="products"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">✖</span>
    <h3 id="mName"></h3>
    <img id="mImg" style="width:100%;border-radius:16px;margin-bottom:.6rem" loading="lazy">
    <p id="mDesc"></p>
    <strong>Choose Weight</strong>
    <div class="weight-boxes">
      <span onclick="setWeight(250,this)">250g</span>
      <span class="active" onclick="setWeight(500,this)">500g</span>
      <span onclick="setWeight(1000,this)">1kg</span>
    </div>
    <div class="qty-box">
      <button onclick="changeModalQty(-1)">➖</button>
      <strong id="modalQty">1</strong>
      <button onclick="changeModalQty(1)">➕</button>
    </div>
    <p><strong>Price:</strong> ₹<span id="mPrice"></span></p>
    <button class="primary" onclick="addToCart()">Add to Cart</button>
  </div>
</div>

<div class="cart" id="cart">
  <h3>Your Order</h3>
  <div id="cartItems"></div>
  <p>Total: ₹<span id="total">0</span></p>
  <input id="location" placeholder="Delivery Location (optional)" style="width:100%;margin:.4rem 0;padding:.4rem">
  <button class="primary" onclick="checkout()">Order on WhatsApp</button>
</div>

<script>
// Admin
const ADMIN_PHONE='7989301401';

// Sample items
let items=[
{name:'Ugadi Pachadi',cat:'Ugadi',base:150,img:'https://images.unsplash.com/photo-1617196032282-7f1e2bdf9e34?auto=format&fit=crop&w=400&q=80',desc:'Fresh Ugadi Pachadi'},
{name:'Neem Flower Pachadi',cat:'Ugadi',base:160,img:'https://images.unsplash.com/photo-1617196032282-7f1e2bdf9e34?auto=format&fit=crop&w=400&q=80',desc:'Delicious Neem Flower Pachadi'},
{name:'Pootharekulu',cat:'Sweets',base:120,img:'https://images.unsplash.com/photo-1617196032300-f0ef4b7b6c4f?auto=format&fit=crop&w=400&q=80',desc:'Crispy Pootharekulu'},
{name:'Chekkalu',cat:'Snacks',base:100,img:'https://images.unsplash.com/photo-1617196032310-94f171f1f1f3?auto=format&w=400&q=80',desc:'Tasty Chekkalu'},
{name:'Kandi Podi',cat:'Podis',base:140,img:'https://images.unsplash.com/photo-1617196032315-1f1f3f1f2f2f?auto=format&w=400&q=80',desc:'Spicy Kandi Podi'},
{name:'Minapa Papad',cat:'Papads',base:50,img:'https://images.unsplash.com/photo-1617196032320-3f1f3f1f2f4f?auto=format&w=400&q=80',desc:'Crispy Minapa Papad'},
{name:'Avakaya',cat:'Pickles',base:200,img:'https://images.unsplash.com/photo-1617196032330-4f1f3f1f2f5f?auto=format&w=400&q=80',desc:'Tangy Avakaya Pickle'}
];

let cat='All',activeItem=null,weight=500,modalQty=1,cart={},count=0,total=0,search='';

const pDiv=document.getElementById('products');
const featuredDiv=document.getElementById('featured');
const modal=document.getElementById('modal');
const mName=document.getElementById('mName');
const mDesc=document.getElementById('mDesc');
const mImg=document.getElementById('mImg');
const mPrice=document.getElementById('mPrice');
const countEl=document.getElementById('count');
const cartItems=document.getElementById('cartItems');
const cartDiv=document.getElementById('cart');
const totalEl=document.getElementById('total');

function render(){pDiv.innerHTML='';items.filter(i=>(cat==='All'||i.cat===cat)&&i.name.toLowerCase().includes(search)).forEach((i,idx)=>{const div=document.createElement('div');div.className='product';div.innerHTML=`<img src="${i.img}"><div class="info"><strong>${i.name}</strong><p>₹${i.base}</p></div>`;div.onclick=()=>openModal(idx);pDiv.appendChild(div);});}
function renderFeatured(){featuredDiv.innerHTML='';items.slice(0,5).forEach((i,idx)=>{const div=document.createElement('div');div.className='featured-item';div.innerHTML=`<img src="${i.img}"><div class="info"><strong>${i.name}</strong><p>₹${i.base}</p></div>`;div.onclick=()=>openModal(items.indexOf(i));featuredDiv.appendChild(div);});}
render(); renderFeatured();

function openModal(i){activeItem=items[i];weight=500;modalQty=1;modal.classList.add('active');mName.innerText=activeItem.name;mDesc.innerText=activeItem.desc;mImg.src=activeItem.img;mPrice.innerText=activeItem.base;}
function closeModal(){modal.classList.remove('active');}
function setWeight(w,e){weight=w;document.querySelectorAll('.weight-boxes span').forEach(s=>s.classList.remove('active'));e.classList.add('active');updatePrice();}
function updatePrice(){mPrice.innerText=Math.round(activeItem.base*(weight/500));}
function changeModalQty(v){modalQty=Math.max(1,modalQty+v);document.getElementById('modalQty').innerText=modalQty;}
function addToCart(){const key=`${activeItem.name} (${weight}g)`;const price=parseInt(mPrice.innerText);if(!cart[key])cart[key]={qty:0,price};cart[key].qty+=modalQty;count+=modalQty;total+=price*modalQty;updateCart();closeModal();}
function updateCart(){cartItems.innerHTML='';countEl.innerText=count;totalEl.innerText=total;for(let k in cart){const div=document.createElement('div');div.className='cart-item';div.innerHTML=`${k} x${cart[k].qty} <span><button onclick="change('${k}',-1)">-</button><button onclick="change('${k}',1)">+</button></span>`;cartItems.appendChild(div);}}
function change(k,d){cart[k].qty+=d;total+=cart[k].price*d;count+=d;if(cart[k].qty<=0)delete cart[k];updateCart();}
function toggleCart(){cartDiv.classList.toggle('open');}
function setCat(c,e){cat=c;document.querySelectorAll('.categories button').forEach(b=>b.classList.remove('active'));e.classList.add('active');render();}
function searchItems(v){search=v.toLowerCase();render();}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}
function toggleDark(){document.body.classList.toggle('dark');}
function checkout(){let loc=document.getElementById('location').value||"Not specified";let msg=`Hello Konaseema Specials 🌸\nLocation: ${loc}\nOrder:\n`;for(let k in cart){msg+=`• ${k} x${cart[k].qty}\n`}msg+=`Total: ₹${total}`;window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`);}
</script>
</body>
</html>
