<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konaseema Specials – WhatsApp Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <div>
    <h1>Konaseema Specials 🌸</h1>
    <button onclick="scrollToTop()">Order Now</button>
  </div>
</div>

<header>
  <input class="search" placeholder="Search" oninput="searchItems(this.value)">
  <div class="logo" onclick="scrollToTop()">Konaseema Specials</div>
  <div>
    <button class="toggle" onclick="toggleDark()">🌙</button>
    <button onclick="toggleCart()">🛒 <span id="count">0</span></button>
  </div>
</header>

<div class="featured" id="featured"></div>

<div class="categories">
  <button class="active" onclick="setCat('All',this)">All</button>
  <button onclick="setCat('Ugadi',this)">🌸 Ugadi</button>
  <button onclick="setCat('Sweets',this)">Sweets</button>
  <button onclick="setCat('Snacks',this)">Snacks</button>
  <button onclick="setCat('Podis',this)">Podis</button>
  <button onclick="setCat('Papads',this)">Papads</button>
  <button onclick="setCat('Pickles',this)">Pickles</button>
</div>

<div class="products" id="products"></div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">✖</span>
    <h3 id="mName"></h3>
    <img id="mImg" style="width:100%;border-radius:16px;margin-bottom:.6rem" loading="lazy">
    <p id="mDesc"></p>
    <strong>Choose Weight</strong>
    <div class="weight-boxes">
      <span onclick="setWeight(250,this)">250g</span>
      <span class="active" onclick="setWeight(500,this)">500g</span>
      <span onclick="setWeight(1000,this)">1kg</span>
    </div>
    <div class="qty-box">
      <button onclick="changeModalQty(-1)">➖</button>
      <strong id="modalQty">1</strong>
      <button onclick="changeModalQty(1)">➕</button>
    </div>
    <p><strong>Price:</strong> ₹<span id="mPrice"></span></p>
    <button class="primary" onclick="addToCart()">Add to Cart</button>
  </div>
</div>

<!-- Cart -->
<div class="cart" id="cart">
  <h3>Your Order</h3>
  <div id="cartItems"></div>
  <p>Total: ₹<span id="total">0</span></p>
  <input id="location" placeholder="Delivery Location (optional)">
  <button class="primary" onclick="checkout()">Order on WhatsApp</button>
</div>

<!-- Sticky WhatsApp Button -->
<button class="whatsapp-btn" onclick="checkout()">🟢 Order on WhatsApp</button>

<!-- Toast Notification -->
<div id="toast">Item Added to Cart ✅</div>

<script src="script.js"></script>
</body>
</html>
